name: Build Coder Abyss

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      GRADLE_OPTS: -Dorg.gradle.workers.max=2

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android SDK NDK and CMake
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Build debug APK
        run: gradle :app:testDebugUnitTest assembleDebug --console=plain

      - name: Verify APK and publish checksum
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -c -P 16 4 "$APK"
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          stat -c '%s bytes' app-debug.apk > APK-SIZE.txt

      - name: Build release AAB
        run: gradle bundleRelease --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Coder-Abyss-APK-v0.6
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/APK-SIZE.txt

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Coder-Abyss-AAB-v0.6
          path: app/build/outputs/bundle/release/app-release.aab
